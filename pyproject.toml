[project]
name = "waypoint"
version = "0.1.0"
description = "A path-bookmark CLI. Type less, get there faster."
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "pyperclip>=1.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.4", "types-PyYAML>=6.0"]

[project.scripts]
wp = "waypoint.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["waypoint"]

[[tool.mypy.overrides]]
# pyperclip ships without type stubs and has no types-* package on PyPI.
module = "pyperclip"
ignore_missing_imports = true
